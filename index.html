<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/debate-files-logo.jpeg" />
    <link rel="apple-touch-icon" href="/debate-files-logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DebateFiles</title>
    <script>
      // Apply saved theme before first paint to avoid flash
      try {
        var saved = JSON.parse(localStorage.getItem('debatefiles.v1') || '{}')
        var theme = saved.settings?.theme || (saved.settings?.darkMode === false ? 'light' : 'dark')
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
